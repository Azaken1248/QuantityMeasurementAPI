server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=native

spring.datasource.url=jdbc:mysql://localhost:3306/quantity_measurement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Ccpbpms@2021

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

logging.level.root=WARN
logging.level.com.seveneleven.quantity_measurement_app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when_authorized